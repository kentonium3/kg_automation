notes: |
  Decommissions the office2 QA pipeline (kentonium3/kg-automation#970):
  qa-register docker DB (:8788), qa-dispatch-webhook (:3457, public Funnel
  :8443), the launcher trio in ~claude, /data/services/qa-register/, and the
  /home/claude/spec-kitty-qa/ code copy. Archive-first (C-003): the entrypoint
  builds a verified sha256 bundle at
  /data/services/host-state/decommission/qa-pipeline-2026-09-08/ (inside the
  Restic source set) BEFORE any removal, and copies the operator + verify
  scripts there.

  DELIBERATE GATE: verification.post FAILS every tick until Kent runs the
  root-only half (ssh office2-kgale, then
  sudo bash <bundle>/operator-root-steps.sh — archives + removes
  /etc/qa-webhook.env, turns Funnel off for :8443 only, writes
  operator-complete.txt) AND verify.sh exits 0 (tri-state contract, all
  removal checks ABSENT, zero UNCHECKABLE). teardown.sh is idempotent, so the
  per-tick re-run while the gate is open is a no-op; the per-tick failure
  alert until the operator acts is a known, accepted cost (plan step 7). Only
  when the gate passes is the deploy recorded applied and the deferred
  rebaseline stamped.

  Tier 2: removes application state (SQLite DB, service env) — recent Restic
  snapshot enforced before apply, and the pre-teardown state enters a snapshot.

  expected_baselines: the port closures (:8443 v4+v6, :3457, :8788) and the
  qa-register image removal drift listening-ports.txt and docker-images.txt
  with NO repo-file signal (#685 caveat), so they are declared here.
