  \ there.\n\nDELIBERATE GATE: verification.post FAILS every tick until Kent runs\
  \ the\nroot-only half (ssh office2-kgale, then\nsudo bash <bundle>/operator-root-steps.sh\
  \ \u2014 archives + removes\n/etc/qa-webhook.env, turns Funnel off for :8443 only,\
